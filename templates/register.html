{% extends 'base.html' %}{% block title %}Create Account · Merco{% endblock %}{% block content %}<div class="form-card"><div class="eyebrow">JOIN THE MARKET</div><h1>Start as a buyer.</h1><p>Every account begins the same way. Once you're inside, Settings lets you become a seller and create your own storefront.</p><form method="post"><label class="label">Your name</label><input name="username" autocomplete="name" required placeholder="Full name"><label class="label">Email</label><input type="email" name="email" autocomplete="email" required placeholder="you@example.com"><label class="label">Password</label><input type="password" name="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"><button class="btn" type="submit">Create account <i class="ri-user-add-line"></i></button></form><p style="margin-top:20px">Already registered? <a href="{{ url_for('login') }}" style="color:var(--cyan)">Sign in</a></p></div>{% endblock %}
