{% extends "base.html" %}
{% block title %}Create Account | Maximise{% endblock %}
{% block content %}
<div class="form-container">
    <div class="eyebrow">Join the marketplace</div><h2>Create your account</h2><p>Start buying, discovering or selling products on Maximise.</p>
    <form method="POST">
        <input type="text" name="username" placeholder="Full name" autocomplete="name" required>
        <input type="email" name="email" placeholder="Email address" autocomplete="email" required>
        <input type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
        <select name="role" aria-label="Account type"><option value="buyer">Buyer</option><option value="seller">Seller</option></select>
        <button type="submit" class="btn full">Create Account <i class="ri-user-add-line"></i></button>
        <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </form>
</div>
{% endblock %}
