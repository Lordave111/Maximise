{% extends 'base.html' %}
{% block title %}Edit {{ product.name }} · Merco{% endblock %}
{% block content %}
<div class="dash-shell"><section class="panel" style="max-width:760px;margin:40px auto"><div class="eyebrow">INVENTORY CONTROL</div><h1>Edit product</h1><p>Update your listing details and price. Your existing listing/payment record is preserved.</p><form method="post" style="display:grid;gap:16px;margin-top:24px"><label>Product name<input name="name" value="{{ product.name }}" required maxlength="200"></label><label>Price (NGN)<input name="price" type="number" min="0" step="0.01" value="{{ product.price }}" required></label><label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="7">{{ product.description or '' }}</textarea></label><div class="dash-actions"><button class="btn" type="submit"><i class="ri-save-line"></i> Save changes</button><a class="btn ghost" href="{{ url_for('seller_dashboard') }}">Cancel</a></div></form></section></div>
{% endblock %}
