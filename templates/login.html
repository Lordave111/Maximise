{% extends "base.html" %}
{% block title %}Login | Maximise{% endblock %}
{% block content %}
<div class="form-container">
    <div class="eyebrow">Welcome back</div><h2>Sign in to Maximise</h2><p>Continue exploring the marketplace and manage your account.</p>
    <form method="POST">
        <input type="email" name="email" placeholder="Email address" autocomplete="email" required>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="btn full">Sign In <i class="ri-arrow-right-line"></i></button>
        <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </form>
</div>
{% endblock %}
