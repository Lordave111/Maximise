{% extends "base.html" %}
{% block title %}Add Product | Maximise{% endblock %}
{% block content %}
<div class="form-container"><div class="eyebrow">Seller workspace</div><h2>Create a listing</h2><p>Give buyers a polished first impression with clear product information.</p><form method="POST" enctype="multipart/form-data"><input type="text" name="name" placeholder="Product name" required><input type="number" step="0.01" name="price" placeholder="Price (₦)" required><textarea name="description" placeholder="Describe your product" rows="6"></textarea><select name="category" required><option value="">Choose a category</option>{% for cat in categories %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}</select><input type="tel" name="whatsapp" placeholder="WhatsApp number" required><label>Cover image</label><input type="file" name="cover_image" accept="image/*" required><label>Product screenshots</label><input type="file" name="screenshots" accept="image/*" multiple><button type="submit" class="btn full">Publish Product <i class="ri-upload-cloud-2-line"></i></button></form></div>
{% endblock %}
