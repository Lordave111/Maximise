{% extends 'base.html' %}{% block title %}Upload Product · Maximise{% endblock %}{% block content %}<div class="form-card"><div class="eyebrow">NEW LISTING</div><h1>Publish a product</h1><p>Your product will appear in the general market and on your individual seller page.</p><form method="post" enctype="multipart/form-data"><label class="label">Product name</label><input name="name" required placeholder="What are you selling?"><label class="label">Price (₦)</label><input name="price" type="number" step="0.01" min="0" required><label class="label">Category</label><select name="category" required><option value="">Choose category</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><label class="label">Description</label><textarea name="description" rows="6" placeholder="Tell buyers what makes this product useful..."></textarea><label class="label">WhatsApp number</label><input name="whatsapp" value="{{ current_user.whatsapp_number or '' }}" required placeholder="2348012345678"><label class="label">Cover image</label><input name="cover_image" type="file" accept="image/*" required><label class="label">Additional images</label><input name="screenshots" type="file" accept="image/*" multiple><button class="btn" type="submit"><i class="ri-upload-cloud-2-line"></i> Publish to market</button></form></div>{% endblock %}
