<!--
  Paste this into your EmailJS template Content editor.
  Required EmailJS variables:
  {{to_email}}, {{subject}}, {{name}}, {{preheader}}, {{message}},
  {{action_url}}, {{action_text}}, {{brand_name}}, {{website_url}}
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;background:#090909;color:#f7f0df;font-family:Arial,Helvetica,sans-serif">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#090909;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#11110f;border:1px solid #3a2e18;border-radius:24px;overflow:hidden">
        <tr><td style="padding:28px 30px;background:linear-gradient(135deg,#1c180f,#0b0b0a);border-bottom:1px solid #3a2e18">
          <div style="font-size:12px;letter-spacing:4px;font-weight:800;color:#d4af62">{{brand_name}}</div>
          <div style="margin-top:8px;font-size:26px;font-weight:800;color:#fff8e8">{{subject}}</div>
        </td></tr>
        <tr><td style="padding:34px 30px">
          <div style="font-size:16px;line-height:1.75;color:#d7d0c2;white-space:pre-line">{{message}}</div>
          <div style="height:24px"></div>
          <a href="{{action_url}}" style="display:inline-block;background:linear-gradient(135deg,#f8dc82,#c89b3c);color:#0b0a08;text-decoration:none;font-weight:800;border-radius:12px;padding:14px 22px">{{action_text}}</a>
          <div style="height:28px"></div>
          <div style="height:1px;background:#2d271b"></div>
          <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#817b70">You received this message because you have an account or activity on {{brand_name}}. If you did not request this, you can safely ignore it.</p>
        </td></tr>
        <tr><td style="padding:20px 30px;background:#0d0d0c;border-top:1px solid #2b2418;color:#706b62;font-size:11px">
          <span>{{brand_name}}</span>{% if website_url %} · <a href="{{website_url}}" style="color:#b89550;text-decoration:none">Visit marketplace</a>{% endif %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
